version: "3.9"

services:
  api:
    # Context is the repo root so registry.json is in scope; see Dockerfile.
    build:
      context: ..
      dockerfile: exchange-api/Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=data/exchange.db
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
