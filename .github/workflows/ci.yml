name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Exchange API (Python/FastAPI) ───────────────────────────────────────
  exchange-api:
    name: Exchange API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exchange-api/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Type check (optional)
        run: |
          pip install pyright
          pyright app/ || true
        continue-on-error: true

  # ── Create MCP Server (Node.js CLI) ─────────────────────────────────────
  create-mcp-server:
    name: CLI Generator Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: create-mcp-server/package.json

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: node --test test/

  # ── Frontend Validation ─────────────────────────────────────────────────
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate registry.json
        run: python -c "import json; json.load(open('registry.json')); print('registry.json is valid JSON')"

      - name: Validate schema
        run: python -c "import json; json.load(open('schema/agent-json/0.1.0.json')); print('Schema is valid JSON')"

      - name: Check HTML structure
        run: |
          grep -q '<!DOCTYPE html>' index.html && echo 'HTML doctype present'
          grep -q 'lang="en"' index.html && echo 'Language attribute present'

  # ── Docker Build ────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: exchange-api

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t agent-exchange-api ./exchange-api

      - name: Test container starts
        run: |
          docker run -d --name test-api -p 8000:8000 agent-exchange-api
          sleep 3
          curl -f http://localhost:8000/health || exit 1
          docker stop test-api
