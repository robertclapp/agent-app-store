name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  # ── Exchange API (Python/FastAPI) ───────────────────────────────────────
  exchange-api:
    name: Exchange API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exchange-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Type check (optional)
        run: |
          pip install pyright
          pyright app/ || true
        continue-on-error: true

  # ── Create MCP Server (Node.js CLI) ─────────────────────────────────────
  create-mcp-server:
    name: CLI Generator Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: create-mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: create-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pass explicit files: `node --test test/` resolves the directory as a
      # module rather than discovering tests inside it, and fails.
      - name: Run tests
        run: node --test test/*.js

  # ── Frontend Validation ─────────────────────────────────────────────────
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Validate registry.json
        run: python -c "import json; json.load(open('registry.json')); print('registry.json is valid JSON')"

      - name: Validate schema
        run: python -c "import json; json.load(open('schema/agent-json/0.1.0.json')); print('Schema is valid JSON')"

      - name: Check HTML structure
        run: |
          grep -q '<!DOCTYPE html>' index.html && echo 'HTML doctype present'
          grep -q 'lang="en"' index.html && echo 'Language attribute present'

  # ── Docker Build ────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: exchange-api

    steps:
      - uses: actions/checkout@v4

      # Context is the repo root so registry.json is in scope; see Dockerfile.
      - name: Build Docker image
        run: docker build -f exchange-api/Dockerfile -t agent-exchange-api .

      # Poll rather than `sleep 3` — a fixed wait races uvicorn's startup and
      # makes this job flaky. Dump container logs if it never becomes healthy.
      - name: Test container starts
        run: |
          docker run -d --name test-api -p 8000:8000 agent-exchange-api
          for i in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:8000/health); then
              echo "container healthy after ${i}s: $body"
              echo "HEALTH_BODY=$body" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          echo "container failed to become healthy; logs:"
          docker logs test-api
          exit 1

      # /health returns ok even when registry.json is missing, which is exactly
      # how the empty-registry bug stayed invisible. Assert the registry really
      # loaded: an empty one 422s every POST /signals and empties the leaderboard.
      - name: Verify registry loaded in container
        run: |
          count=$(printf '%s' "$HEALTH_BODY" | python -c "import json,sys; print(json.load(sys.stdin)['tools_known'])")
          echo "tools_known=$count"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: container started with an empty tool registry."
            docker logs test-api
            exit 1
          fi
          echo "OK: registry loaded with $count tools."

      - name: Stop container
        if: always()
        run: docker rm -f test-api || true
