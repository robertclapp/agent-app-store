name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── Exchange API (Python/FastAPI) ───────────────────────────────────────
  exchange-api:
    name: Exchange API Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: exchange-api

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exchange-api/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short

      - name: Type check
        run: pyright app/

  # ── Create MCP Server (Node.js CLI) ─────────────────────────────────────
  create-mcp-server:
    name: CLI Generator Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    defaults:
      run:
        working-directory: create-mcp-server

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: create-mcp-server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Audit dependencies
        run: npm audit

  # ── Frontend Validation ─────────────────────────────────────────────────
  frontend:
    name: Frontend Validation
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate registry.json
        run: python3 -c "import json; json.load(open('registry.json')); print('registry.json is valid JSON')"

      - name: Verify generated well-known registry is current
        run: python3 scripts/sync_registry.py --check

      - name: Validate schema
        run: python3 -c "import json; json.load(open('schema/agent-json/0.1.0.json')); print('Schema is valid JSON')"

      - name: Check HTML structure
        run: |
          grep -q '<!DOCTYPE html>' index.html && echo 'HTML doctype present'
          grep -q 'lang="en"' index.html && echo 'Language attribute present'

      - name: Run frontend security tests
        run: node --test test/frontend.test.js

  # ── Docker Build ────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: exchange-api

    steps:
      - uses: actions/checkout@v4

      # Exercise the real Compose definition, including its in-container
      # healthcheck. This catches dependencies (such as curl) that are absent
      # from python:3.12-slim.
      - name: Build and start Docker Compose service
        run: docker compose -f exchange-api/docker-compose.yml up -d --build

      - name: Wait for Compose healthcheck
        run: |
          container_id=$(docker compose -f exchange-api/docker-compose.yml ps -q api)
          for i in $(seq 1 60); do
            health=$(docker inspect --format '{{.State.Health.Status}}' "$container_id")
            if [ "$health" = "healthy" ]; then
              body=$(curl -fsS http://localhost:8000/health)
              echo "container healthy after ${i}s: $body"
              echo "HEALTH_BODY=$body" >> "$GITHUB_ENV"
              exit 0
            fi
            if [ "$health" = "unhealthy" ]; then
              break
            fi
            sleep 1
          done
          echo "container failed to become healthy; logs:"
          docker compose -f exchange-api/docker-compose.yml logs api
          exit 1

      # Assert both health semantics and the canonical registry copy in the
      # image. /health now fails closed when no tools were loaded.
      - name: Verify registry loaded and database writable in container
        run: |
          count=$(printf '%s' "$HEALTH_BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['tools_known'])")
          database=$(printf '%s' "$HEALTH_BODY" | python3 -c "import json,sys; print(json.load(sys.stdin)['database'])")
          echo "tools_known=$count database=$database"
          if [ "$count" -lt 1 ]; then
            echo "FAIL: container started with an empty tool registry."
            docker compose -f exchange-api/docker-compose.yml logs api
            exit 1
          fi
          # The container runs as a non-root user against a named volume; if
          # ownership is ever wrong the API serves reads but fails every POST.
          if [ "$database" != "writable" ]; then
            echo "FAIL: database is not writable by the container user."
            docker compose -f exchange-api/docker-compose.yml exec -T api sh -c 'id -u; ls -ln /app/data' || true
            docker compose -f exchange-api/docker-compose.yml logs api
            exit 1
          fi
          echo "OK: registry loaded with $count tools; database $database."

      - name: Stop container
        if: always()
        run: docker compose -f exchange-api/docker-compose.yml down -v
